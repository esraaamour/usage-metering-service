services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metering
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metering"]
      interval: 3s
      timeout: 3s
      retries: 15

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/metering
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/plans >/dev/null 2>&1 || [ $$? -eq 1 ]"]
      interval: 3s
      timeout: 3s
      retries: 15

  client:
    build: .
    command: ["node", "client.js"]
    environment:
      - API_URL=http://app:3000
    depends_on:
      app:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
